!
hostname distrib-4
!
! --- VTP Version 3 Configuration (North Domain) ---
!
vtp domain xyz
vtp version 3
! Mode: Server (Synchronizing with Primary Server: distrib-3)
!
! --- Spanning Tree Optimization (Deterministic Load Balancing) ---
!
spanning-tree mode rapid-pvst
spanning-tree vlan 70,80 priority 24576
spanning-tree vlan 50,60 priority 28672
!
! --- EtherChannel (LACP Passive Mode to Distrib-3) ---
!
interface Port-channel1
 description ** EtherChannel to Distrib-3 (Inter-Distribution Link) **
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 channel-group 1 mode passive
!
interface Ethernet0/2
 channel-group 1 mode passive
!
! --- L3 Uplinks to Core Layer (Redundant Paths) ---
!
interface Ethernet2/1
 description ** L3 Uplink to Core-1 **
 no switchport
 ip address 192.168.6.2 255.255.255.252
!
interface Ethernet2/2
 description ** L3 Uplink to Core-2 **
 no switchport
 ip address 192.168.9.2 255.255.255.252
!
! --- SVI & VRRP Gateway Redundancy (Active-Active Design) ---
!
interface Vlan50
 description ** Engineering Gateway (Backup) **
 ip address 50.50.50.252 255.255.255.0
 vrrp 50 ip 50.50.50.254
 vrrp 50 authentication text xyz123
!
interface Vlan60
 description ** Research Gateway (Backup) **
 ip address 60.60.60.252 255.255.255.0
 vrrp 60 ip 60.60.60.254
 vrrp 60 authentication text xyz123
!
interface Vlan70
 description ** Logistics Gateway (Master) **
 ip address 70.70.70.252 255.255.255.0
 vrrp 70 ip 70.70.70.254
 vrrp 70 priority 102
 vrrp 70 authentication text xyz123
!
interface Vlan80
 description ** Management Gateway (Master) **
 ip address 80.80.80.252 255.255.255.0
 vrrp 80 ip 80.80.80.254
 vrrp 80 priority 102
 vrrp 80 authentication text xyz123
!
! --- OSPF Routing Integration (Area 2 & Area 0) ---
!
router ospf 1
 router-id 6.6.6.6
 network 50.50.50.0 0.0.0.255 area 2
 network 60.60.60.0 0.0.0.255 area 2
 network 70.70.70.0 0.0.0.255 area 2
 network 80.80.80.0 0.0.0.255 area 2
 network 192.168.6.0 0.0.0.3 area 0
 network 192.168.9.0 0.0.0.3 area 0
!
end
