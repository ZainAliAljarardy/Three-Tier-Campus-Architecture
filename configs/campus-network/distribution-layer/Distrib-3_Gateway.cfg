!
hostname distrib-3
!
! --- VTP Version 3 Configuration (North Domain) ---
!
vtp domain xyz
vtp version 3
vtp mode server vlan
! Primary identity established as the authoritative source for domain "xyz"
!
! --- DHCP Pools (North Departments) ---
!
ip dhcp pool net50
 network 50.50.50.0 255.255.255.0
 default-router 50.50.50.254
!
ip dhcp pool net60
 network 60.60.60.0 255.255.255.0
 default-router 60.60.60.254
!
ip dhcp pool net70
 network 70.70.70.0 255.255.255.0
 default-router 70.70.70.254
!
ip dhcp pool net80
 network 80.80.80.0 255.255.255.0
 default-router 80.80.80.254
!
! --- Spanning Tree Optimization (Rapid-PVST+) ---
!
spanning-tree mode rapid-pvst
spanning-tree vlan 50,60 priority 24576
spanning-tree vlan 70,80 priority 28672
!
! --- EtherChannel (Active LACP to Distrib-4) ---
!
interface Port-channel1
 description ** EtherChannel to Distrib-4 **
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 channel-group 1 mode active
!
interface Ethernet0/2
 channel-group 1 mode active
!
! --- L3 Uplinks to Core Layer (North Paths) ---
!
interface Ethernet2/1
 description ** L3 Uplink to Core-2 **
 no switchport
 ip address 192.168.10.2 255.255.255.252
!
interface Ethernet2/2
 description ** L3 Uplink to Core-1 **
 no switchport
 ip address 192.168.5.2 255.255.255.252
!
! --- SVI & VRRP Configuration (North Departments) ---
!
interface Vlan50
 description ** Engineering Gateway **
 ip address 50.50.50.253 255.255.255.0
 vrrp 50 ip 50.50.50.254
 vrrp 50 priority 102
 vrrp 50 authentication text xyz123
!
interface Vlan60
 description ** Research Gateway **
 ip address 60.60.60.253 255.255.255.0
 vrrp 60 ip 60.60.60.254
 vrrp 60 priority 102
 vrrp 60 authentication text xyz123
!
interface Vlan70
 description ** Logistics Gateway **
 ip address 70.70.70.253 255.255.255.0
 vrrp 70 ip 70.70.70.254
 vrrp 70 authentication text xyz123
!
interface Vlan80
 description ** Management Gateway **
 ip address 80.80.80.253 255.255.255.0
 vrrp 80 ip 80.80.80.254
 vrrp 80 authentication text xyz123
!
! --- OSPF Routing (Area 2 Segmentation) ---
!
router ospf 1
 router-id 5.5.5.5
 network 50.50.50.0 0.0.0.255 area 2
 network 60.60.60.0 0.0.0.255 area 2
 network 70.70.70.0 0.0.0.255 area 2
 network 80.80.80.0 0.0.0.255 area 2
 network 192.168.5.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.3 area 0
!
end
