!
hostname distrib-1
!
! --- VTP Version 3 Configuration ---
!
! VTP Mode: Primary Server for Domain "abc"
vtp domain abc
vtp version 3
vtp mode server vlan
! Note: Primary server identity is established via "vtp primary vlan" in exec mode
!
! --- DHCP Pools (South Departments) ---
!
ip dhcp pool net10
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.254
!
ip dhcp pool net20
 network 20.20.20.0 255.255.255.0
 default-router 20.20.20.254
!
ip dhcp pool net30
 network 30.30.30.0 255.255.255.0
 default-router 30.30.30.254
!
ip dhcp pool net40
 network 40.40.40.0 255.255.255.0
 default-router 40.40.40.254
!
! --- Spanning Tree (Rapid-PVST) ---
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20 priority 24576
spanning-tree vlan 30,40 priority 28672
!
! --- EtherChannel to Distrib-2 ---
!
interface Port-channel1
 description ** EtherChannel to Distrib-2 **
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 channel-group 1 mode active
!
interface Ethernet0/2
 channel-group 1 mode active
!
! --- L3 Uplinks to Core Layer ---
!
interface Ethernet1/0
 description ** L3 Link to Core-2 **
 no switchport
 ip address 192.168.8.2 255.255.255.252
!
interface Ethernet1/1
 description ** L3 Link to Core-1 **
 no switchport
 ip address 192.168.3.2 255.255.255.252
!
! --- SVI & VRRP Gateway Redundancy ---
!
interface Vlan10
 description ** Marketing Gateway **
 ip address 10.10.10.253 255.255.255.0
 vrrp 10 ip 10.10.10.254
 vrrp 10 priority 102
 vrrp 10 authentication text abc123
!
interface Vlan20
 description ** IT Gateway **
 ip address 20.20.20.253 255.255.255.0
 vrrp 20 ip 20.20.20.254
 vrrp 20 priority 102
 vrrp 20 authentication text abc123
!
interface Vlan30
 description ** Account Gateway **
 ip address 30.30.30.253 255.255.255.0
 vrrp 30 ip 30.30.30.254
 vrrp 30 authentication text abc123
!
interface Vlan40
 description ** HR Gateway **
 ip address 40.40.40.253 255.255.255.0
 vrrp 40 ip 40.40.40.254
 vrrp 40 authentication text abc123
!
! --- OSPF Routing ---
!
router ospf 1
 router-id 3.3.3.3
 network 10.10.10.0 0.0.0.255 area 1
 network 20.20.20.0 0.0.0.255 area 1
 network 30.30.30.0 0.0.0.255 area 1
 network 40.40.40.0 0.0.0.255 area 1
 network 192.168.3.0 0.0.0.3 area 0
 network 192.168.8.0 0.0.0.3 area 0
!
end
