!
hostname distrib-2
!
! --- VTP Version 3 Configuration ---
!
! VTP Mode: Server (Secondary) for Domain "abc"
vtp domain abc
vtp version 3
!
! --- Spanning Tree Optimization (Complementary Load Balancing) ---
!
spanning-tree mode rapid-pvst
spanning-tree vlan 30,40 priority 24576
spanning-tree vlan 10,20 priority 28672
!
! --- EtherChannel (LACP Passive Mode) ---
!
interface Port-channel1
 description ** EtherChannel to Distrib-1 **
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 channel-group 1 mode passive
!
interface Ethernet0/2
 channel-group 1 mode passive
!
! --- Uplinks to Core Layer (Redundant L3 Paths) ---
!
interface Ethernet1/0
 description ** L3 Uplink to Core-1 **
 no switchport
 ip address 192.168.4.2 255.255.255.252
!
interface Ethernet1/1
 description ** L3 Uplink to Core-2 **
 no switchport
 ip address 192.168.7.2 255.255.255.252
!
! --- SVI & VRRP Gateway Redundancy (Active-Active Design) ---
!
interface Vlan10
 description ** Marketing Gateway (Backup) **
 ip address 10.10.10.252 255.255.255.0
 vrrp 10 ip 10.10.10.254
 vrrp 10 authentication text abc123
!
interface Vlan20
 description ** IT Gateway (Backup) **
 ip address 20.20.20.252 255.255.255.0
 vrrp 20 ip 20.20.20.254
 vrrp 20 authentication text abc123
!
interface Vlan30
 description ** Account Gateway (Master) **
 ip address 30.30.30.252 255.255.255.0
 vrrp 30 ip 30.30.30.254
 vrrp 30 priority 102
 vrrp 30 authentication text abc123
!
interface Vlan40
 description ** HR Gateway (Master) **
 ip address 40.40.40.252 255.255.255.0
 vrrp 40 ip 40.40.40.254
 vrrp 40 priority 102
 vrrp 40 authentication text abc123
!
! --- OSPF Routing Integration ---
!
router ospf 1
 router-id 4.4.4.4
 network 10.10.10.0 0.0.0.255 area 1
 network 20.20.20.0 0.0.0.255 area 1
 network 30.30.30.0 0.0.0.255 area 1
 network 40.40.40.0 0.0.0.255 area 1
 network 192.168.4.0 0.0.0.3 area 0
 network 192.168.7.0 0.0.0.3 area 0
!
end
