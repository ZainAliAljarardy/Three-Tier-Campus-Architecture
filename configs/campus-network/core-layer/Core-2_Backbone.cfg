!
hostname Core-2
!
! --- Inter-Core Connectivity (Redundant P2P) ---
!
interface Ethernet0/1
 description ** Redundant Link to Core-1 (Trunk 1) **
 no switchport
 ip address 192.168.2.2 255.255.255.252
!
interface Ethernet0/2
 description ** Redundant Link to Core-1 (Trunk 2) **
 no switchport
 ip address 192.168.1.2 255.255.255.252
!
! --- North Distribution Links (Redundant Paths) ---
!
interface Ethernet2/1
 description ** Link to Distrib-4 (Redundant Path) **
 no switchport
 ip address 192.168.9.1 255.255.255.252
!
interface Ethernet2/2
 description ** Link to Distrib-3 (Redundant Path) **
 no switchport
 ip address 192.168.10.1 255.255.255.252
!
! --- South Distribution Links (Redundant Paths) ---
!
interface Ethernet1/0
 description ** Link to Distrib-2 (Redundant Path) **
 no switchport
 ip address 192.168.7.1 255.255.255.252
!
interface Ethernet1/1
 description ** Link to Distrib-1 (Redundant Path) **
 no switchport
 ip address 192.168.8.1 255.255.255.252
!
! --- OSPF Backbone Configuration ---
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 192.168.1.0 0.0.0.3 area 0
 network 192.168.2.0 0.0.0.3 area 0
 network 192.168.7.0 0.0.0.3 area 0
 network 192.168.8.0 0.0.0.3 area 0
 network 192.168.9.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.3 area 0
!
! --- Management ---
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login
!
end
