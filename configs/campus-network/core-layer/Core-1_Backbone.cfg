!
hostname Core-1
!
! --- Inter-Core Connectivity (P2P) ---
!
interface Ethernet0/1
 description ** Link to Core-2 (Primary Trunk 1) **
 no switchport
 ip address 192.168.1.1 255.255.255.252
!
interface Ethernet0/2
 description ** Link to Core-2 (Primary Trunk 2) **
 no switchport
 ip address 192.168.2.1 255.255.255.252
!
! --- North Distribution Links ---
!
interface Ethernet2/1
 description ** Link to Distrib-3 (VLANs 50-80 Gateway) **
 no switchport
 ip address 192.168.5.1 255.255.255.252
!
interface Ethernet2/2
 description ** Link to Distrib-4 (VLANs 50-80 Gateway) **
 no switchport
 ip address 192.168.6.1 255.255.255.252
!
! --- South Distribution Links ---
!
interface Ethernet1/0
 description ** Link to Distrib-2 (VLANs 10-40 Gateway) **
 no switchport
 ip address 192.168.3.1 255.255.255.252
!
interface Ethernet1/1
 description ** Link to Distrib-1 (VLANs 10-40 Gateway) **
 no switchport
 ip address 192.168.4.1 255.255.255.252
!
! --- OSPF Backbone Configuration ---
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 network 192.168.1.0 0.0.0.3 area 0
 network 192.168.2.0 0.0.0.3 area 0
 network 192.168.3.0 0.0.0.3 area 0
 network 192.168.4.0 0.0.0.3 area 0
 network 192.168.5.0 0.0.0.3 area 0
 network 192.168.6.0 0.0.0.3 area 0
!
! --- Management ---
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login
!
end
